<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BADMINTON — Badminton Shop Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#ffeef7;color:#5b3c50}button{font:inherit;border:0;cursor:pointer}#app{height:100%;position:relative;overflow:hidden}#game{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.pill{background:#fff8fcdd;border:2px solid #f4b6d5;border-radius:18px;padding:7px 11px;font-weight:800;box-shadow:0 4px 12px #d98ab044}#title{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:1000;color:#e76aa5;text-shadow:0 2px #fff;pointer-events:none}#panel{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(430px,92vw);background:#fff8fcf5;border:2px solid #f3afd0;border-radius:22px;padding:15px;box-shadow:0 12px 35px #b85f8b55;display:none}#panel h3{margin:0 0 7px;color:#d95691}#actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.action{background:#ef7fb0;color:white;padding:9px 12px;border-radius:13px;font-weight:800}.secondary{background:#f8d6e6;color:#8a4b69}#toast{position:absolute;left:50%;top:82px;transform:translateX(-50%);background:#6b4960;color:#fff;padding:9px 14px;border-radius:18px;display:none;font-weight:800}#start{position:absolute;inset:0;background:linear-gradient(160deg,#ffd9ea,#fff7fb 55%,#e9d9ff);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.card{width:min(440px,94vw);background:#fffaff;border:3px solid #f4b3d3;border-radius:30px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px #b45c8a40}.logo{font-size:58px;margin-bottom:4px}h1{margin:0;color:#e45f9d;font-size:42px;letter-spacing:2px}.sub{color:#8d6279;margin:4px 0 18px;font-weight:800}.play{width:100%;padding:15px;border-radius:17px;background:linear-gradient(90deg,#ef79ad,#b995e8);color:white;font-size:18px;font-weight:1000;box-shadow:0 7px 0 #d15f94}.hint{font-size:12px;color:#9a7188;margin-top:15px}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="title">🏸 BADMINTON</div>
<div id="hud"><div class="pill">💰 <span id="money">2.000.000đ</span></div><div class="pill">⭐ <span id="rep">5.0</span></div><div class="pill">👥 <span id="customers">0</span></div><div class="pill">🧵 <span id="jobs">0</span> đơn căng lưới</div></div>
<div id="toast"></div><div id="panel"><h3 id="ptitle">Thông tin</h3><div id="pbody"></div><div id="actions"></div></div>
<div id="start"><div class="card"><div class="logo">🏸</div><h1>BADMINTON</h1><div class="sub">Badminton Shop Simulator</div><p>Quản lý shop cầu lông dễ thương, tư vấn khách, bán hàng và nhận đơn đan/căng lưới.</p><button class="play" id="play">▶ VÀO SHOP</button><div class="hint">Chạm vào sàn để di chuyển • Chạm khách/kệ để tương tác</div></div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W=1000,H=650,started=false,money=2000000,rep=5,served=0,jobs=0;const p={x:500,y:565,tx:500,ty:565};
const sh=[['VỢT CẦU LÔNG','🏸',75,130,145,72,18,650000],['CẦU LÔNG','🪶',75,245,145,72,35,120000],['GIÀY','👟',275,130,145,72,12,480000],['QUẦN ÁO','👕',275,245,145,72,20,220000],['PHỤ KIỆN','🎒',475,130,145,72,28,90000],['CƯỚC & QUẤN CÁN','🧵',475,245,145,72,30,90000]];
const staff=[['Mai','Tư vấn',820,490,'#f08bb6'],['Linh','Kỹ thuật',880,490,'#a88de4']];const cs=[];let cid=1;
function rs(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(c.width/W,0,0,c.height/H,0,0)}rs();addEventListener('resize',rs);
const fmt=n=>n.toLocaleString('vi-VN')+'đ';function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1600)}
function close(){document.getElementById('panel').style.display='none'}function show(t,b,bs=[]){document.getElementById('ptitle').textContent=t;document.getElementById('pbody').innerHTML=b;let a=document.getElementById('actions');a.innerHTML='';bs.forEach(q=>{let z=document.createElement('button');z.className='action';z.textContent=q[0];z.onclick=q[1];a.appendChild(z)});document.getElementById('panel').style.display='block'}
function hud(){document.getElementById('money').textContent=fmt(money);document.getElementById('rep').textContent=rep.toFixed(1);document.getElementById('customers').textContent=served;document.getElementById('jobs').textContent=jobs}
function move(o,a,b,s){let dx=a-o.x,dy=b-o.y,d=Math.hypot(dx,dy);if(d>2){o.x+=dx/d*s;o.y+=dy/d*s}}
function buy(i){let q=sh[i];if(q[6]<1){toast('Hết hàng 😭');return}q[6]--;money+=q[7];served++;rep=Math.min(5,rep+.02);hud();toast('Bán '+q[0]+' +'+fmt(q[7]));close()}
function advice(id){show('🗣️ TƯ VẤN KHÁCH','Khách #'+id+' muốn mua đồ nhưng chưa biết chọn loại nào.',[['🏸 Mới chơi — vợt dễ đánh',()=>{money+=650000;served++;rep=Math.min(5,rep+.06);toast('Tư vấn đúng nhu cầu! +650.000đ');close();hud()}],['💪 Thích đánh công',()=>{money+=900000;served++;rep=Math.min(5,rep+.05);toast('Khách mua vợt công! +900.000đ');close();hud()}],['🎯 Hỏi thêm lối chơi',()=>show('🎯 TƯ VẤN TIẾP','Khách: “Em đánh đôi, thích phản tạt nhanh.”',[['🏸 Gợi ý vợt 4U',()=>{money+=820000;served++;toast('Khách mua vợt 4U!');close();hud()}],['🧵 Tư vấn cước 26 lbs',()=>{jobs++;money+=180000;rep=Math.min(5,rep+.08);toast('Khách đặt đan lưới! +180.000đ');close();hud()}]])]])}
function net(){jobs++;money+=180000;rep=Math.min(5,rep+.04);toast('Đã nhận đơn căng 26 lbs +180.000đ');close();hud()}
function tap(X,Y){for(let i=0;i<cs.length;i++)if(Math.hypot(cs[i].x-X,cs[i].y-Y)<38){advice(cs[i].id);return}for(let i=0;i<sh.length;i++){let q=sh[i];if(X>q[2]-20&&X<q[2]+q[4]+20&&Y>q[3]-20&&Y<q[3]+q[5]+20){show('🛒 '+q[0],'Tồn kho: <b>'+q[6]+'</b>',[['Bán 1 sản phẩm',()=>buy(i)]]);return}}for(let e of staff)if(Math.hypot(e[2]-X,e[3]-Y)<40){show('👩‍🔧 '+e[0]+' • '+e[1],'Nhân viên đang làm việc.');return}if(X>650&&Y>395){show('🧵 GÓC ĐAN / CĂNG LƯỚI','Nhận vợt, chọn cước và mức căng. Đơn cơ bản <b>180.000đ</b>.',[['Nhận đơn 26 lbs',net],['Nhận đơn 28 lbs',()=>{jobs++;money+=220000;toast('Đơn 28 lbs +220.000đ');close();hud()}]]);}}
c.addEventListener('pointerdown',e=>{if(!started)return;let r=c.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*W,Y=(e.clientY-r.top)/r.height*H;p.tx=X;p.ty=Y;tap(X,Y)});document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';toast('Chào mừng đến BADMINTON! 🏸')};
function person(px,py,col,label){x.fillStyle=col;x.beginPath();x.arc(px,py-12,11,0,7);x.fill();x.fillStyle='#ffe0c7';x.beginPath();x.arc(px,py-26,9,0,7);x.fill();x.fillStyle='#5b3c50';x.font='bold 10px Arial';x.fillText(label,px-22,py+8)}
function zone(a,b,w,h,t){x.fillStyle='#fff8fc';x.strokeStyle='#edb1cf';x.lineWidth=2;x.fillRect(a,b,w,h);x.strokeRect(a,b,w,h);x.fillStyle='#8a5b72';x.font='bold 14px Arial';x.fillText(t,a+12,b+25)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#fff0f7';x.fillRect(0,0,W,H);x.fillStyle='#f8d4e5';x.fillRect(0,0,W,80);x.fillStyle='#ffeaf4';x.fillRect(35,92,930,545);x.strokeStyle='#f2bdd5';x.lineWidth=1;for(let a=35;a<965;a+=32){x.beginPath();x.moveTo(a,92);x.lineTo(a,637);x.stroke()}for(let b=92;b<637;b+=32){x.beginPath();x.moveTo(35,b);x.lineTo(965,b);x.stroke()}x.fillStyle='#d9659e';x.font='bold 20px Arial';x.fillText('🏸 BADMINTON',55,52);zone(670,105,275,150,'🪑 KHU TƯ VẤN');zone(670,275,275,100,'📦 KHO');zone(670,400,275,175,'🧵 ĐAN / CĂNG LƯỚI');sh.forEach(q=>{x.fillStyle='#eaa2c2';x.fillRect(q[2],q[3],q[4],q[5]);x.fillStyle='#fff8fc';x.fillRect(q[2]+7,q[3]+7,q[4]-14,q[5]-14);x.font='24px Arial';x.fillText(q[1],q[2]+12,q[3]+35);x.fillStyle='#714b61';x.font='bold 10px Arial';x.fillText(q[0],q[2]+43,q[3]+27);x.font='10px Arial';x.fillText('Tồn: '+q[6],q[2]+43,q[3]+46)});x.fillStyle='#d9659e';x.fillRect(430,545,140,92);x.fillStyle='#fff';x.font='bold 12px Arial';x.fillText('🚪 CỬA VÀO',465,592);staff.forEach(e=>person(e[2],e[3],e[4],e[0]));cs.forEach(q=>{move(q,160+Math.sin(q.id)*180,350+Math.cos(q.id)*50,.5);person(q.x,q.y,q.col,'Khách '+q.id)});person(p.x,p.y,'#ef72aa','Bạn')}
let last=performance.now(),sp=0;function loop(n){let dt=n-last;last=n;if(started){sp+=dt;if(sp>3500&&cs.length<6){cs.push({id:cid++,x:500,y:620,col:['#f39ab9','#9cc9e9','#b7a0e8','#f2c27b'][cs.length%4]});sp=0}move(p,p.tx,p.ty,3.5);hud()}draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop);
</script></body></html>
